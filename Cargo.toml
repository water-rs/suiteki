[package]
name = "suiteki"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
authors = ["Lexo Liu <me@lexo.cool>"]
description = "A no_std string type that borrows static strings and reference-counts owned ones"
repository = "https://github.com/water-rs/suiteki"
homepage = "https://github.com/water-rs/suiteki"
documentation = "https://docs.rs/suiteki"
license = "Apache-2.0 OR MIT"
readme = "README.md"
keywords = ["string", "no_std", "refcount", "cow", "text"]
categories = ["text-processing", "data-structures", "no-std"]

[badges]
maintenance = { status = "actively-developed" }

[dependencies]
serde = { version = "1.0", default-features = false, features = [
  "alloc",
], optional = true }
nami-core = { version = "0.3.3", default-features = false }

[features]
default = []
serde = ["dep:serde"]

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = "warn"
style = "warn"
correctness = "warn"
complexity = "warn"
suspicious = "warn"
perf = "warn"
pedantic = "warn"
nursery = "warn"
cargo = "warn"
# Every `unsafe` must state why it is sound, in a form the compiler checks.
undocumented_unsafe_blocks = "warn"
multiple_crate_versions = { level = "allow", priority = 1 }
