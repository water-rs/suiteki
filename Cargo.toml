[package]
name = "suiteki"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
authors = ["Lexo Liu <me@lexo.cool>"]
description = "A no_std string type that stores short strings inline, borrows static ones and reference-counts owned ones"
repository = "https://github.com/water-rs/suiteki"
homepage = "https://github.com/water-rs/suiteki"
documentation = "https://docs.rs/suiteki"
license = "Apache-2.0 OR MIT"
readme = "README.md"
keywords = ["string", "no_std", "refcount", "cow", "text"]
categories = ["text-processing", "data-structures", "no-std"]

[badges]
maintenance = { status = "actively-developed" }

[dependencies]
serde = { version = "1.0", default-features = false, features = [
  "alloc",
], optional = true }
nami-core = { version = "0.3.3", default-features = false, optional = true }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[features]
# `std` only adds the impls that need the standard library's own types
# (`OsStr`, `Path`, `ToSocketAddrs`). It is on by default because those impls
# are part of the API every current consumer compiles against; turning it off
# is what makes this a genuine `no_std + alloc` crate.
default = ["std"]
std = []
serde = ["dep:serde"]
nami = ["dep:nami-core"]

# `cargo bench` hands its arguments to every target that has a bench harness.
# Only the criterion target below understands them, so the default libtest
# harness is turned off everywhere else.
[lib]
bench = false

[[test]]
name = "allocations"
bench = false

[[test]]
name = "debug_representation"
bench = false

[[bench]]
name = "str"
harness = false

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = "warn"
style = "warn"
correctness = "warn"
complexity = "warn"
suspicious = "warn"
perf = "warn"
pedantic = "warn"
nursery = "warn"
cargo = "warn"
# Every `unsafe` must state why it is sound, in a form the compiler checks.
undocumented_unsafe_blocks = "warn"
multiple_crate_versions = { level = "allow", priority = 1 }
